<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB ? Medium Copier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1>?? FB ? Medium Copier</h1>
            <div class="header-stats">
                <span id="totalPosts">0 Posts</span>
                <span id="postedCount">0 Posted</span>
                <span id="progressPercent">0%</span>
            </div>
        </header>

        <!-- Main Area -->
        <div class="main-area">
            <!-- Left: Posts List -->
            <div class="posts-panel">
                <div class="search-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search posts...">
                    <div class="category-row" id="categoryChips"></div>
                </div>
                <div class="posts-list" id="postsList">
                    <div class="loading-overlay">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
                <div class="pagination-bar">
                    <span id="paginationInfo">0 results</span>
                    <div class="preview-actions">
                        <button class="btn btn-sm btn-outline" id="prevBtn">? Prev</button>
                        <button class="btn btn-sm btn-outline" id="nextBtn">Next ?</button>
                    </div>
                </div>
            </div>

            <!-- Right: Preview -->
            <div class="preview-panel">
                <div class="preview-header">
                    <span class="preview-title" id="previewTitle">Select a post</span>
                    <div class="preview-actions" id="previewActions" style="display:none;">
                        <button class="btn btn-sm btn-primary" id="copyBtn">?? Copy</button>
                        <button class="btn btn-sm btn-success" id="markPostedBtn">? Mark Posted</button>
                    </div>
                </div>
                <div class="preview-content" id="previewContent">
                    <div class="preview-empty">
                        <div class="preview-empty-icon">??</div>
                        <p>Click on a post to preview it here</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Footer -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text">
                <span id="progressText">0 / 0 posted</span>
                <span id="progressPercentText">0% complete</span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
