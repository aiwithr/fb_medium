<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB to Medium Copier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1>FB to Medium</h1>
                <p class="header-subtitle">Copy and track your posts</p>
            </div>
            <div class="header-right">
                <div class="stat-badge"><span class="stat-num" id="totalPosts">0</span><span class="stat-lbl">Posts</span></div>
                <div class="stat-badge"><span class="stat-num" id="postedCount">0</span><span class="stat-lbl">Posted</span></div>
            </div>
        </header>
        <main class="main">
            <aside class="sidebar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search posts..." autocomplete="off">
                </div>
                <div class="filters" id="categoryFilters"><button class="filter-chip active" data-category="all">All</button></div>
                <div class="posts-list" id="postsList"></div>
                <div class="pagination">
                    <button class="btn-icon" id="prevBtn">&lt;</button>
                    <span id="pageInfo">Page 1</span>
                    <button class="btn-icon" id="nextBtn">&gt;</button>
                </div>
            </aside>
            <section class="content">
                <div class="content-header" id="contentHeader">
                    <div class="post-meta" id="postMeta"></div>
                    <div class="content-actions" id="contentActions">
                        <button class="btn btn-copy" id="copyBtn">Copy Text</button>
                        <button class="btn btn-posted" id="markPostedBtn">Mark as Posted</button>
                    </div>
                </div>
                <div class="content-body" id="contentBody">
                    <div class="empty-state">
                        <h3>Select a post</h3>
                        <p>Click on any post to preview</p>
                    </div>
                </div>
            </section>
        </main>
        <footer class="footer">
            <div class="progress-wrapper">
                <span id="progressText">0 / 0 posted</span>
                <span id="progressPercent">0%</span>
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            </div>
        </footer>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="loading" id="loading"><div class="spinner"></div><p>Loading posts...</p></div>
    <script src="app.js"></script>
</body>
</html>
